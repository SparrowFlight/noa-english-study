<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10231c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NOA英语">
  <title>出海英语训练台</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="app.css?v=15" onerror="document.documentElement.classList.add('css-failed')">
  <style>
    html { background: #f4f0e7; color: #10231c; font-family: "Microsoft YaHei UI", "PingFang SC", sans-serif; }
    body { margin: 0; }
    .boot-placeholder { padding: 48px; font-size: 20px; }
    .boot-error {
      display: none;
      margin: 24px;
      padding: 20px;
      border: 2px solid #a83935;
      border-radius: 14px;
      color: #7e2422;
      background: #fff3f1;
      font-size: 18px;
    }
    .css-failed .boot-error { display: block; }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <div class="app-shell">
    <header class="topbar">
      <button class="brand" data-route="home" aria-label="回到首页">
        <span class="brand-mark">NOA</span>
        <span>
          <strong>出海英语训练台</strong>
          <small>一次只做一件事</small>
        </span>
      </button>
      <div class="topbar-actions">
        <button class="icon-button" id="speak-button" title="朗读页面上的英文" aria-label="朗读英文">朗读</button>
        <button class="icon-button" id="fullscreen-button" title="全屏（F）" aria-label="全屏">全屏</button>
      </div>
    </header>

    <nav class="side-nav" aria-label="主要导航">
      <button class="nav-item active" data-route="home"><span>01</span>今天·必做</button>
      <button class="nav-item" data-route="plan"><span>02</span>12周路线</button>
      <button class="nav-item" data-route="practice"><span>03</span>场景加练</button>
      <button class="nav-item" data-route="phrases"><span>04</span>句库查询</button>
      <button class="nav-item" data-route="review"><span>05</span>主动复习</button>
      <button class="nav-item" data-route="assessment"><span>06</span>测评</button>
      <button class="nav-item" data-route="settings"><span>07</span>设置</button>
    </nav>

    <main id="main" tabindex="-1">
      <div class="boot-placeholder">正在加载今日训练……</div>
    </main>
    <div class="boot-error" id="boot-error">
      页面没有完整加载。请关闭这个标签页，重新双击“启动学习助手.cmd”。
    </div>

    <footer class="keyboard-bar" aria-label="键盘快捷键">
      <span><kbd>Enter</kbd> 开始 / 下一步</span>
      <span><kbd>Space</kbd> 暂停 / 继续</span>
      <span><kbd>R</kbd> 显示答案</span>
      <span><kbd>←</kbd><kbd>→</kbd> 上一步 / 下一步</span>
      <span><kbd>F</kbd> 全屏</span>
      <span><kbd>Esc</kbd> 返回</span>
    </footer>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="assessment-data.js?v=15"></script>
  <script src="technical-plan.js?v=15"></script>
  <script src="balanced-plan.js?v=15"></script>
  <script src="app.js?v=15"></script>
</body>
</html>
